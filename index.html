<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einkaufsliste</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            height: fit-content;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 400px;
            overflow-y: auto;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            background: #f1f5f9;
            border-radius: 8px;
            transition: all 0.2s;
        }

        li.completed {
            background: #e2e8f0;
            opacity: 0.7;
        }

        li.completed span {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            flex: 1;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .delete-btn {
            background: transparent;
            color: var(--danger);
            padding: 0.25rem 0.5rem;
            font-size: 0.85rem;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .status-sync {
            font-size: 0.75rem;
            color: #10b981;
            text-align: right;
            margin-top: 1rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛒 Einkaufsliste</h1>
        <p class="subtitle">Einfach, lokal gespeichert und fehlerfrei.</p>

        <div class="input-group">
            <input type="text" id="itemInput" placeholder="Neuen Artikel hinzufügen..." onkeydown="if(event.key === 'Enter') addItem()">
            <button onclick="addItem()">Hinzufügen</button>
        </div>

        <ul id="shoppingList"></ul>

        <div class="status-sync" id="syncStatus">Status: Bereit ✓</div>
    </div>

    <script>
        // Lokaler Speicher
        let items = JSON.parse(localStorage.getItem('shopping_items')) || [];

        function saveAndRender() {
            localStorage.setItem('shopping_items', JSON.stringify(items));
            renderList();
        }

        function addItem() {
            const input = document.getElementById('itemInput');
            const text = input.value.trim();
            if(!text) return;

            items.push({ id: Date.now(), text: text, completed: false });
            input.value = '';
            saveAndRender();
        }

        function toggleItem(id) {
            const item = items.find(i => i.id === id);
            if(item) {
                item.completed = !item.completed;
                saveAndRender();
            }
        }

        function deleteItem(id) {
            items = items.filter(i => i.id !== id);
            saveAndRender();
        }

        function renderList() {
            const listEl = document.getElementById('shoppingList');
            listEl.innerHTML = '';

            if (items.length === 0) {
                listEl.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 1rem;">Die Liste ist leer.</p>';
                return;
            }

            items.forEach(item => {
                const li = document.createElement('li');
                if(item.completed) li.classList.add('completed');

                li.innerHTML = `
                    <div class="item-left" onclick="toggleItem(${item.id})">
                        <input type="checkbox" ${item.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleItem(${item.id})">
                        <span>${escapeHtml(item.text)}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteItem(${item.id})">Löschen</button>
                `;
                listEl.appendChild(li);
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Initiale Ansicht laden
        renderList();
    </script>
</body>
</html>
